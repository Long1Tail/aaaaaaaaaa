server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}